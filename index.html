<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulay Elementary School – Lesson Plan Submission</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--t:#0f8b8d;--td:#0a6567;--y:#ffc82e;--bg:#f2fbfb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:#12373a}
header{background:linear-gradient(120deg,var(--td),var(--t));color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;border-bottom:5px solid var(--y)}
header img{width:58px;height:58px;border-radius:50%;background:#fff}
header h1{font-size:1.2rem;margin:0}header small{opacity:.9}
#who{margin-left:auto;text-align:right;font-size:.85rem}
button,.btn{background:var(--y);color:#12373a;border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer}
button.alt{background:#fff;border:2px solid var(--t);color:var(--td)}
main{max-width:980px;margin:auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 6px 20px #0f8b8d22;margin-bottom:22px}
.hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center;text-align:center}
.hero svg{width:170px;animation:bob 2.4s ease-in-out infinite}
.bubble{background:var(--y);padding:14px 20px;border-radius:20px;font-size:1.3rem;font-weight:800;position:relative}
.bubble:before{content:"";position:absolute;left:-14px;top:50%;border:10px solid transparent;border-right-color:var(--y);border-left:0;margin-top:-10px}
.wave{transform-origin:84px 80px;animation:wave 1s ease-in-out infinite}
@keyframes wave{50%{transform:rotate(-35deg)}}@keyframes bob{50%{transform:translateY(-6px)}}
.faculty{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.faculty svg{width:100%;background:linear-gradient(#e6f7f7,#fff);border-radius:14px;border-bottom:4px solid var(--y)}
h2{color:var(--td);margin-top:0}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
label{font-size:.85rem;font-weight:600;display:flex;flex-direction:column;gap:4px}
input,select{padding:10px;border:2px solid #cfe9e9;border-radius:10px;font:inherit}
input:focus,select:focus{outline:0;border-color:var(--t)}
.full{grid-column:1/-1}
#msg{font-weight:700;margin-top:10px}.ok{color:#087f3f}.err{color:#c0392b}
table{width:100%;border-collapse:collapse;font-size:.85rem}th{background:var(--t);color:#fff;text-align:left}
th,td{padding:8px;border-bottom:1px solid #dff;}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.scroll{overflow-x:auto}
.hide{display:none!important}#login{text-align:center}
</style></head><body>
<header><img src="logo.png" alt="Logo"><div><h1>Tulay Elementary School</h1><small>Lesson Plan Submission Portal</small></div>
<div id="who" class="hide"><span id="uname"></span><br><button class="alt" onclick="logout()">Sign out / Mag-logout</button></div></header>
<main>
<section id="login" class="card">
<div class="hero"><div id="w1"></div><div class="bubble">Welcome! 👋<br><small>Maligayang pagdating, Ma'am/Sir!</small></div></div>
<p>Mag-sign in gamit ang <b>DepEd email</b> o <b>Gmail</b> para makapag-submit ng lesson plan.</p>
<div id="gbtn" style="display:inline-block"></div></section>

<div id="app" class="hide">
<section class="card hero"><div id="w2"></div><div class="bubble">Welcome, <span id="fn"></span>!</div></section>
<section class="card"><h2>Our Faculty</h2><div class="faculty" id="fac"></div></section>
<nav id="tabs" class="hide tools"><button onclick="show('sub')">Submit</button><button class="alt" onclick="show('dash')">Admin Dashboard</button></nav>
<section class="card" id="sub"><h2>Submit Lesson Plan</h2>
<form id="f">
<label>1. Fill in your details – Full name<input id="name" required></label>
<label>Email<input id="email" readonly></label>
<label>Grade level<select id="grade" required><option>Kinder</option><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option><option>Grade 5</option><option>Grade 6</option></select></label>
<label>Section<input id="section" required></label>
<label>Subject<input id="subject" required></label>
<label>Quarter<select id="quarter"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
<label>Week<select id="week"></select></label>
<label>Date<input type="date" id="date" required></label>
<label class="full">2. Attach your file (PDF, Word, Excel, PPT, JPG/PNG – max 10 MB)
<input type="file" id="file" required accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png"></label>
<div class="full"><button id="go">3. Submit</button><div id="msg"></div></div>
</form></section>
<section class="card hide" id="dash"><h2>All Submissions</h2>
<div class="tools"><input id="q" placeholder="Search name, subject, file…" oninput="draw()" style="flex:1">
<select id="fq" onchange="draw()"><option value="">All quarters</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
<select id="fg" onchange="draw()"><option value="">All grades</option></select>
<button class="alt" onclick="load()">Refresh</button></div>
<div class="scroll"><table><thead><tr><th>Date sent</th><th>Name</th><th>Grade/Sec</th><th>Subject</th><th>Q</th><th>Wk</th><th>File</th></tr></thead><tbody id="rows"></tbody></table></div>
<p id="cnt"></p></section>
</div></main>
<script>
// ====== I-EDIT ITO ======
const API="PASTE_APPS_SCRIPT_WEB_APP_URL", CLIENT_ID="PASTE_GOOGLE_CLIENT_ID";
// ========================
const $=i=>document.getElementById(i);let token=sessionStorage.t||"",rows=[],busy=0;
function av(f,skin,hair,cloth,wave){return `<svg viewBox="0 0 100 120">${f?`<rect x="20" y="28" width="60" height="52" rx="26" fill="${hair}"/>`:""}<path d="M14 120c0-28 15-38 36-38s36 10 36 38z" fill="${cloth}"/><rect x="43" y="66" width="14" height="14" fill="${skin}"/>${wave?`<g class="wave"><rect x="80" y="40" width="9" height="42" rx="4.5" fill="${skin}"/><circle cx="84.5" cy="38" r="6" fill="${skin}"/></g>`:""}<circle cx="50" cy="45" r="24" fill="${skin}"/>${f?`<path d="M25 48c-3-26 10-34 25-34s28 8 25 34c-4-12-11-18-25-18s-21 6-25 18z" fill="${hair}"/>`:`<path d="M26 42c0-22 12-27 24-27s24 5 24 27c-4-10-12-14-24-14s-20 4-24 14z" fill="${hair}"/>`}<circle cx="41" cy="47" r="2.6" fill="#222"/><circle cx="59" cy="47" r="2.6" fill="#222"/><circle cx="35" cy="54" r="3.5" fill="#f4a0a0" opacity=".6"/><circle cx="65" cy="54" r="3.5" fill="#f4a0a0" opacity=".6"/><path d="M42 55q8 8 16 0" stroke="#222" stroke-width="2" fill="none"/></svg>`}
const sk=["#f1c9a5","#e0ac82","#c98e66"],T=[[1,sk[0],"#3b2417","#0f8b8d"],[1,sk[1],"#1e1410","#ffc82e"],[1,sk[2],"#2a1b12","#e86a8d"],[0,sk[1],"#1e1410","#2f6fb3"],[1,sk[0],"#6b3f1d","#7a5cc2"],[1,sk[2],"#111","#0a6567"],[1,sk[1],"#4a2c17","#f08a3c"],[1,sk[0],"#1e1410","#4caf7d"],[1,sk[2],"#3b2417","#d94f4f"]];
$("w1").innerHTML=$("w2").innerHTML=av(1,sk[1],"#2a1b12","#0f8b8d",1);
$("fac").innerHTML=T.map(t=>av(...t)).join("");
for(let i=1;i<=10;i++)$("week").add(new Option("Week "+i,i));
$("date").valueAsDate=new Date();
function jwt(t){return JSON.parse(decodeURIComponent(escape(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")))))}
function api(a,d={}){return fetch(API,{method:"POST",body:JSON.stringify({action:a,token,...d})}).then(r=>r.json())}
window.onload=()=>{google.accounts.id.initialize({client_id:CLIENT_ID,callback:r=>{token=sessionStorage.t=r.credential;enter()}});
google.accounts.id.renderButton($("gbtn"),{theme:"filled_blue",size:"large",text:"signin_with"});if(token)enter()}
async function enter(){try{const p=jwt(token);if(p.exp*1000<Date.now())return logout();
$("login").classList.add("hide");$("app").classList.remove("hide");$("who").classList.remove("hide");
$("uname").textContent=p.email;$("name").value=p.name||"";$("email").value=p.email;$("fn").textContent=(p.given_name||p.name||"Teacher");
const m=await api("me");if(m.admin){$("tabs").classList.remove("hide");}}catch(e){logout()}}
function logout(){sessionStorage.clear();token="";location.reload()}
function show(s){$("sub").classList.toggle("hide",s!="sub");$("dash").classList.toggle("hide",s!="dash");if(s=="dash")load()}
$("f").onsubmit=async e=>{e.preventDefault();if(busy)return;const f=$("file").files[0],m=$("msg");
if(f.size>10*1024*1024){m.className="err";m.textContent="Masyadong malaki ang file (max 10 MB).";return}
busy=1;$("go").disabled=true;m.className="";m.textContent="Ina-upload… maghintay po.";
try{const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(f)});
const r=await api("submit",{name:$("name").value,grade:$("grade").value,section:$("section").value,subject:$("subject").value,quarter:$("quarter").value,week:$("week").value,date:$("date").value,file:{name:f.name,type:f.type,data}});
if(r.ok){m.className="ok";m.textContent="✅ Naipasa na! Nagpadala kami ng confirmation sa email mo.";$("file").value=""}else{m.className="err";m.textContent="Error: "+r.error}}
catch(x){m.className="err";m.textContent="May problema sa koneksyon. Subukan ulit."}busy=0;$("go").disabled=false};
async function load(){const r=await api("list");if(!r.ok){alert(r.error);return}rows=r.rows;
const g=[...new Set(rows.map(x=>x[3]))];$("fg").innerHTML='<option value="">All grades</option>'+g.map(x=>`<option>${x}</option>`).join("");draw()}
function draw(){const q=$("q").value.toLowerCase(),a=$("fq").value,g=$("fg").value;
const v=rows.filter(r=>(!a||String(r[6])==a)&&(!g||r[3]==g)&&(!q||r.join(" ").toLowerCase().includes(q)));
$("rows").innerHTML=v.map(r=>`<tr><td>${new Date(r[0]).toLocaleDateString()}</td><td>${esc(r[1])}<br><small>${esc(r[2])}</small></td><td>${esc(r[3])} ${esc(r[4])}</td><td>${esc(r[5])}</td><td>${esc(r[6])}</td><td>${esc(r[7])}</td><td><a href="${esc(r[9])}" target="_blank">${esc(r[8])}</a></td></tr>`).join("");
$("cnt").textContent=v.length+" of "+rows.length+" submissions"}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
</script></body></html>
